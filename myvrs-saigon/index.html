:root {
  /* palette from the building: pearl fins, blush interior, pearl-white portal */
  --pearl: #f3efe9;
  --pearl-2: #e9e3da;
  --paper: #fbf9f6;
  --ink: #161515;
  --muted: #6b655f;
  --blush: #e8c5bf;
  --rose: #a9625b;
  --night: #111012;
  --line: #d8d0c5;
  /* type system from myvrs.io: Space Grotesk for display and labels, Inter for text, Pretendard for Korean */
  --kr: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --display: "Space Grotesk", var(--kr);
  --body: Inter, var(--kr);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--pearl); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
:lang(ko) body, :lang(ko) { word-break: keep-all; overflow-wrap: break-word; }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; letter-spacing: -0.025em; line-height: 1.04; margin: 0; text-wrap: balance; }
:lang(ko) h1, :lang(ko) h2, :lang(ko) h3, :lang(ko) h4 { line-height: 1.22; letter-spacing: -0.03em; }
p { margin: 0; max-width: 62ch; text-wrap: pretty; }
.wrap { width: min(1240px, 100% - 40px); margin-inline: auto; }
.label, .eyebrow { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: 0.27em; text-transform: uppercase; line-height: 1.6; }
.eyebrow { color: var(--rose); }
.h2 { font-size: clamp(36px, 5.2vw, 72px); margin-top: 16px; }
:lang(ko) .h2 { font-size: clamp(30px, 4.2vw, 56px); }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
/* wide label tracking reads well in Latin, too loose in Hangul */
:lang(ko) .label, :lang(ko) .eyebrow, :lang(ko) .chip, :lang(ko) .nav nav a, :lang(ko) .btn, :lang(ko) .facts span, :lang(ko) .specs span, :lang(ko) .rail a { letter-spacing: 0.1em; }

/* draft banner */
.draft { background: var(--ink); color: #d9d2c9; font-size: 12.5px; text-align: center; padding: 8px 16px; line-height: 1.5; }
.draft b { color: #fff; font-weight: 600; }

/* nav */
header.nav { position: sticky; top: 0; z-index: 20; background: rgba(243, 239, 233, 0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 28px; height: 64px; }
.mark { font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: 0.06em; text-decoration: none; white-space: nowrap; }
.mark small { font-weight: 500; letter-spacing: 0.32em; font-size: 10px; margin-left: 10px; color: var(--muted); }
.nav nav { display: flex; gap: 24px; margin-left: auto; }
.nav nav a { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; color: var(--muted); white-space: nowrap; }
.nav nav a:hover { color: var(--ink); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { font: 500 11px/1 var(--display); letter-spacing: 0.18em; background: none; border: 0; padding: 9px 12px 9px 13px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--pearl); }
@media (max-width: 1100px) { .nav nav { display: none; } .lang { margin-left: auto; } }

/* hero */
.hero { position: relative; background: var(--night); color: #fff; }
.hero-img { position: relative; height: clamp(460px, 76vh, 780px); overflow: hidden; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; }
.fins { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n, 36), 1fr); pointer-events: none; }
.fins i { background: linear-gradient(90deg, #f6f2ec, #ddd5ca 60%, #f6f2ec); transform-origin: 50% 50%; transform: scaleX(var(--open, 0.045)); opacity: 0.5; animation: open 1.6s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
@keyframes open { from { transform: scaleX(1); opacity: 1; } to { transform: scaleX(var(--open, 0.045)); opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .fins i { animation: none; } }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,12,0.78) 0%, rgba(10,10,12,0.4) 42%, rgba(10,10,12,0) 68%), linear-gradient(0deg, rgba(10,10,12,0.6), rgba(10,10,12,0) 45%); }
.hero-copy { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: clamp(32px, 6vh, 64px); }
.hero h1 { font-size: clamp(52px, 9vw, 136px); line-height: 0.94; letter-spacing: -0.04em; margin-top: 18px; }
:lang(ko) .hero h1 { line-height: 0.94; letter-spacing: -0.04em; }
.hero h1 em { font-style: normal; color: var(--blush); }
.hero .lead { margin-top: 24px; font-size: clamp(16px, 1.45vw, 19px); color: #ece6de; max-width: 46ch; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.45); border-radius: 999px; padding: 9px 16px; font: 600 11px/1.2 var(--display); letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }
.chip.solid { background: var(--blush); color: var(--ink); border-color: var(--blush); text-decoration: none; }
.hero-note { border-top: 1px solid #2a2828; color: #a49d95; font-size: 11.5px; padding: 10px 0; line-height: 1.5; }
.hero-note .wrap { display: flex; justify-content: flex-end; text-align: right; }

/* how it works */
section { padding: clamp(72px, 9vw, 128px) 0; }
.how-head { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: end; }
.how-head p { color: var(--muted); }
.steps { list-style: none; margin: 56px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--ink); }
.steps li { padding: 24px 20px 0 0; border-right: 1px solid var(--line); margin-right: 20px; }
.steps li:last-child { border-right: 0; margin-right: 0; }
.steps .t { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -0.03em; color: var(--rose); font-variant-numeric: tabular-nums; }
.steps h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin-top: 16px; line-height: 1.3; }
.steps p { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
@media (max-width: 960px) { .how-head { grid-template-columns: 1fr; gap: 20px; } .steps { grid-template-columns: 1fr 1fr; row-gap: 32px; } .steps li { border-right: 0; margin-right: 0; } }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }

/* device */
.pods { background: var(--pearl-2); }
.dev-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); align-items: center; }
.device { margin: 0; isolation: isolate; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: clamp(18px, 3vw, 36px); }
.device-svg { width: 100%; height: auto; max-height: 640px; display: block; font-family: var(--display); }
.dv-arc { animation: arc 6s ease-in-out infinite alternate; transform-origin: 50% 50%; }
@keyframes arc { from { opacity: .45; } to { opacity: .95; } }
@media (prefers-reduced-motion: reduce) { .dv-arc { animation: none; } }
.device figcaption { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.55; }
.dev-copy p { color: #3f3b37; }
.parts { list-style: none; margin: 28px 0 0; padding: 0; counter-reset: part; border-top: 1px solid var(--line); }
.parts li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
.parts li::before { counter-increment: part; content: counter(part); width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font: 700 11px/22px var(--display); text-align: center; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 30px; }
.facts div { padding-right: 12px; }
.facts b { display: block; font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.facts span { display: block; margin-top: 8px; font: 600 10.5px/1.5 var(--display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 900px) { .dev-grid { grid-template-columns: 1fr; } .device { max-width: 520px; } }

/* floors: scroll story */
.floors { background: var(--pearl); padding-bottom: clamp(40px, 6vw, 80px); }
.floors-head { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: end; }
.floors-head p { color: var(--muted); }
.floor-tabs { position: sticky; top: 64px; z-index: 6; margin: clamp(24px, 3.5vw, 44px) calc(-1 * var(--gut, 0px)) 0; padding: 10px 0; background: rgba(243, 239, 233, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.rail { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.rail a { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; min-width: 52px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--pearl); text-decoration: none; font: 600 12px/1 var(--display); letter-spacing: 0.06em; color: var(--muted); transition: background .3s, color .3s, border-color .3s; }
.rail a span { display: none; margin-left: 8px; font-weight: 500; letter-spacing: 0.02em; }
.rail a[aria-current="true"] { background: var(--ink); color: var(--pearl); border-color: var(--ink); }
.rail a[aria-current="true"] span { display: inline; }
.level { padding: clamp(44px, 7vh, 88px) 0; border-top: 1px solid var(--line); scroll-margin-top: 119px; }
.level:first-child { border-top: 0; }
.lv-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(20px, 3.5vw, 56px); align-items: end; }
.lv-num { font: 700 clamp(56px, 6vw, 92px)/0.9 var(--display); letter-spacing: -0.05em; color: var(--blush); }
.level h3 { font-size: clamp(26px, 2.6vw, 36px); margin-top: 12px; }
.level p { margin: 0; color: #3f3b37; }
.level ul { margin: 16px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
.level li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.45; }
.lv-pair { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 14px; margin-top: clamp(22px, 3vw, 36px); align-items: stretch; }
.lv-pair figure { margin: 0; display: flex; flex-direction: column; min-width: 0; }
.lv-pair figcaption { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
.lv-pair figcaption .label { color: var(--ink); letter-spacing: 0.2em; font-size: 10px; flex: none; font-family: var(--display); font-weight: 600; }
.lv-iso .pic { background: var(--pearl); isolation: isolate; border: 1px solid var(--line); border-radius: 3px; aspect-ratio: 1400 / 1019; display: grid; place-items: center; }
.lv-iso img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.lv-views { display: grid; gap: 14px; grid-template-rows: repeat(var(--n, 1), minmax(0, 1fr)); min-width: 0; }
.lv-views figure { min-height: 0; }
.lv-views .pic { flex: 1; min-height: 0; border-radius: 3px; overflow: hidden; background: var(--line); }
.lv-views img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 900px) {
  .floors-head { grid-template-columns: 1fr; gap: 18px; }
  .lv-head { grid-template-columns: 1fr; gap: 14px; }
  .level ul { grid-template-columns: 1fr; }
  .lv-pair { grid-template-columns: 1fr; }
  .lv-views { grid-template-rows: none; }
  .lv-views .pic { aspect-ratio: 16 / 9; flex: none; }
  .rail a { min-width: 44px; height: 32px; padding: 0 10px; }
  .rail a[aria-current="true"] span { display: none; }
}

/* goods */
.goods { background: var(--pearl-2); }
.split { display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(28px, 4vw, 64px); align-items: center; }
.figure { margin: 0; }
.figure img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.figure figcaption { font-size: 12px; color: var(--muted); margin-top: 10px; }
.goods p { margin-top: 22px; color: #3f3b37; }
.nfc { display: flex; gap: 14px; align-items: center; margin-top: 28px; padding: 18px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); max-width: 460px; }
.nfc svg { flex: none; }
.nfc p { margin: 0; font-size: 14px; color: var(--muted); }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

/* building */
.building { background: var(--night); color: #efe9e1; }
.building .eyebrow { color: var(--blush); }
.building p { margin-top: 22px; color: #cfc8bf; }
.building-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; margin-top: 44px; }
.building-grid img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.specs { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 36px; border-top: 1px solid #3a3836; }
.specs div { padding: 16px 16px 0 0; }
.specs b { display: block; font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.specs span { display: block; margin-top: 8px; font: 600 10.5px/1.5 var(--display); letter-spacing: 0.2em; text-transform: uppercase; color: #a59e96; }
@media (max-width: 900px) { .building-grid { grid-template-columns: 1fr; } .specs { grid-template-columns: 1fr 1fr; row-gap: 22px; } }

/* budget */
.budget { background: var(--pearl); }
.budget-head { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: end; }
.budget-head p { color: var(--muted); }
.b-top { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: clamp(28px, 4vw, 64px); margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--ink); align-items: start; }
.b-total .big { font: 700 clamp(48px, 6vw, 84px)/1 var(--display); letter-spacing: -0.04em; margin-top: 14px; font-variant-numeric: tabular-nums; }
.b-total .sub { margin-top: 12px; color: var(--muted); font-size: 14px; }
.stackbar { display: flex; gap: 2px; height: 34px; margin-top: 6px; }
.stackbar span { display: block; height: 100%; min-width: 4px; }
.stackbar span:first-child { border-radius: 4px 0 0 4px; }
.stackbar span:last-child { border-radius: 0 4px 4px 0; }
.stackbar .c3, .bar-legend .c3 { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 3px, transparent 3px 7px); }
.bar-legend { list-style: none; margin: 18px 0 0; padding: 0; }
.bar-legend li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 52px; gap: 12px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.bar-legend i { width: 12px; height: 12px; border-radius: 3px; display: block; transform: translateY(1px); }
.bar-legend b { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.bar-legend em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.c1 { background-color: #6250d6; } .c2 { background-color: #c0574b; } .c3 { background-color: #d99000; }
.b-floors { margin-top: 56px; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: clamp(28px, 4vw, 64px); }
.b-floors h3 { font-size: 22px; }
.b-floors .hint { margin-top: 10px; color: var(--muted); font-size: 14px; }
.fbars { list-style: none; margin: 0; padding: 0; }
.fbars li { display: grid; grid-template-columns: 44px minmax(0, 1fr) 92px; gap: 14px; align-items: center; padding: 7px 0; }
.fbars .fl { font: 700 13px/1 var(--display); }
.fbars .trk { position: relative; height: 22px; }
.fbars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #c0574b; border-radius: 0 4px 4px 0; }
.fbars .nm { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #fff; white-space: nowrap; }
.fbars .amt { font: 700 14px/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.fbars li:hover .fill, .stackbar span:hover { filter: brightness(1.08); }
.b-note { margin-top: 40px; font-size: 12.5px; color: var(--muted); max-width: 92ch; line-height: 1.6; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: #fff; font-size: 12.5px; line-height: 1.5; padding: 8px 11px; border-radius: 6px; opacity: 0; transition: opacity .12s; max-width: 260px; }
.tip b { font-family: var(--display); }
@media (max-width: 900px) { .budget-head, .b-top, .b-floors { grid-template-columns: 1fr; gap: 20px; } }
@media (max-width: 520px) { .fbars li { grid-template-columns: 34px minmax(0, 1fr) 76px; gap: 10px; } .fbars .nm { display: none; } }

/* visit */
.visit-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: end; }
.visit .h2 { font-size: clamp(44px, 7vw, 104px); }
:lang(ko) .visit .h2 { font-size: clamp(36px, 5.4vw, 76px); }
.addr { font-size: 20px; line-height: 1.5; }
.addr small { display: block; font-size: 14px; color: var(--muted); margin-top: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 20px; border-radius: 999px; border: 1px solid var(--ink); text-decoration: none; font: 600 11px/1.2 var(--display); letter-spacing: 0.2em; text-transform: uppercase; }
.btn.dark { background: var(--ink); color: var(--pearl); }
.btn:hover { background: var(--blush); color: var(--ink); border-color: var(--blush); }
@media (max-width: 900px) { .visit-grid { grid-template-columns: 1fr; } }

footer { border-top: 1px solid var(--line); padding: 28px 0 40px; font-size: 12.5px; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; }

/* ---------- motion layer (R09) ----------
   Every element is complete at rest. Motion replays only when an element scrolls into view,
   parallax moves things without hiding them, and prefers-reduced-motion switches it all off. */
header.nav .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--rose); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); pointer-events: none; }
.nav nav a { position: relative; transition: color .3s; }
.nav nav a::after { content: ""; position: absolute; left: 0; right: 0.2em; bottom: -7px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: 0 50%; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.nav nav a.on { color: var(--ink); }
.nav nav a.on::after, .nav nav a:hover::after { transform: scaleX(1); }

@keyframes rise { from { transform: translate3d(0, 28px, 0); opacity: .3; } }
.hero-img img { transform: translate3d(0, calc(var(--hp, 0) * 9%), 0) scale(calc(1.04 + var(--hp, 0) * 0.1)); will-change: transform; }
.hero-copy { transform: translate3d(0, calc(var(--hp, 0) * -70px), 0); opacity: calc(1 - var(--hp, 0) * 0.85); }
.hero-copy .wrap > * { animation: rise 1s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(.3s + var(--i, 0) * .13s); }
.hero-copy .wrap > :nth-child(2) { --i: 1; } .hero-copy .wrap > :nth-child(3) { --i: 2; } .hero-copy .wrap > :nth-child(4) { --i: 3; }
.hero h1 em { display: inline-block; background: linear-gradient(90deg, var(--blush), #f6dcd6 45%, var(--blush) 70%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 7s ease-in-out 1.6s infinite; }
@keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }

/* program ticker: the six floors, always moving */
.ticker { overflow: hidden; background: var(--night); color: #efe9e1; border-top: 1px solid #2a2828; }
.ticker-track { display: flex; width: max-content; animation: tick 70s linear infinite; }
.ticker:hover .ticker-track { animation-play-state: paused; }
.ticker-track span { display: inline-flex; align-items: center; gap: 14px; padding: 15px 0 15px 26px; font: 600 12.5px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
:lang(ko) .ticker-track span { letter-spacing: .08em; }
.ticker-track span b { color: var(--blush); font-weight: 700; letter-spacing: .04em; }
.ticker-track span::after { content: ""; width: 4px; height: 20px; margin-left: 12px; background: linear-gradient(90deg, #f6f2ec, #b9b0a5); transform: skewX(-28deg); opacity: .65; }
@keyframes tick { to { transform: translate3d(-50%, 0, 0); } }

/* reveal on entering view */
.rv.play { animation: rise .9s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
.wipe.play img { animation: wipe 1.15s cubic-bezier(.7,0,.2,1) backwards; animation-delay: calc(var(--i, 0) * 140ms); }
@keyframes wipe { from { clip-path: inset(0 0 0 100%); transform: scale(1.08); } to { clip-path: inset(0 0 0 0); transform: none; } }
.lv-iso .pic { overflow: hidden; }
.lv-views .pic img { transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.lv-views .pic:hover img { transform: scale(1.045); }

/* how it works: a line runs along the five steps as you scroll */
.steps { position: relative; }
.steps::before { content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 3px; background: var(--rose); transform-origin: 0 50%; transform: scaleX(var(--sp, 1)); }
.steps .t { transition: color .5s; }
.steps.live li:not(.lit) .t { color: #cbc2b7; }

/* device: parts light up in turn; hover a part or a badge to hold it */
.dv-badge { cursor: pointer; }
.dv-badge circle { transition: fill .35s, transform .35s cubic-bezier(.2,.7,.2,1); transform-box: fill-box; transform-origin: center; }
.dv-badge.on circle { fill: var(--rose); transform: scale(1.25); }
.parts li { transition: background .35s, padding .35s; border-radius: 3px; }
.parts li::before { transition: background .35s; }
.parts li.on { background: var(--paper); padding-left: 8px; }
.parts li.on::before { background: var(--rose); }
.nfc .arc { animation: nfc 2.4s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .28s); }
@keyframes nfc { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* floor rail: one pill slides to the active floor */
.rail { position: relative; }
.rail li { position: relative; z-index: 1; }
.rail .rail-pill { position: absolute; z-index: 0; left: 0; top: 0; width: 52px; height: 34px; border-radius: 17px; background: var(--ink); opacity: 0; pointer-events: none; transition: transform .5s cubic-bezier(.2,.7,.2,1), width .5s cubic-bezier(.2,.7,.2,1), opacity .3s; }
.rail.has-pill .rail-pill { opacity: 1; }
.rail.has-pill a[aria-current="true"] { background: transparent; border-color: transparent; }

/* day / dusk comparison */
.compare { position: relative; overflow: hidden; border-radius: 3px; aspect-ratio: 1400 / 788; background: #000; --x: 50%; }
.building-grid .compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
.compare .top { clip-path: inset(0 0 0 var(--x)); }
.compare input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; touch-action: pan-y; }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--x); width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
.cmp-line .knob { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.compare input:focus-visible + .cmp-line .knob, .compare input:focus-visible ~ .cmp-line .knob { outline: 2px solid var(--blush); outline-offset: 3px; }
.cmp-tag { position: absolute; top: 14px; padding: 7px 12px; border-radius: 999px; font: 600 10.5px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; background: rgba(10,10,12,.6); color: #fff; pointer-events: none; }
:lang(ko) .cmp-tag { letter-spacing: .1em; }
.cmp-tag.l { left: 14px; } .cmp-tag.r { right: 14px; }

/* fin study canvas */
.finstudy { margin: 12px 0 0; padding: 18px clamp(12px, 2vw, 24px) 16px; border: 1px solid #2c2a29; border-radius: 3px; background: #161417; }
.finstudy canvas { display: block; width: 100%; height: clamp(200px, 21vw, 270px); cursor: crosshair; touch-action: pan-y; }
.finstudy figcaption { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: baseline; margin-top: 12px; font-size: 12.5px; color: #a59e96; line-height: 1.55; }
.finstudy figcaption .label { color: var(--blush); }
.fin-read { font: 700 15px/1.2 var(--display); color: #f3efe9; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.01em; }
@media (max-width: 700px) { .finstudy figcaption { grid-template-columns: 1fr; gap: 6px; } }

/* budget bars grow when they come into view */
.b-top.play .stackbar span { animation: growX .95s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(.2s + var(--i, 0) * .14s); transform-origin: 0 50%; }
@keyframes growX { from { transform: scaleX(0); } }
.b-floors.play .fbars .fill { animation: growW 1.05s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(.15s + var(--i, 0) * .09s); }
@keyframes growW { from { width: 0; } }

/* visit: Saigon local time */
.clock { display: flex; align-items: baseline; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
.clock b { font: 700 44px/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.clock .colon { animation: blink 2s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }

@media (prefers-reduced-motion: reduce) {
  .rv.play, .wipe.play img, .b-top.play .stackbar span, .b-floors.play .fbars .fill, .hero-copy .wrap > *, .ticker-track, .nfc .arc, .clock .colon, .hero h1 em { animation: none !important; }
  .hero-img img, .hero-copy { transform: none !important; opacity: 1 !important; }
  .rail .rail-pill, .dv-badge circle, .parts li, .lv-views .pic img { transition: none; }
}
</style>

  levels.querySelectorAll(".level").forEach(l => io.observe(l));
}
// budget: figures come from the estimate workbook (R05), all VAT-inclusive
const BUDGET = {"usd_vnd": 25700, "krw_vnd": 18.17, "total": 15089829075, "exterior": 7025947619, "interior": 6341083456, "shared": 1722798000, "floors": [["1F", 957237159], ["2F", 744292490], ["3F", 752369131], ["4F", 959732481], ["5F", 1347990989], ["6F", 1579461206]]};
function money(vnd, l, short) {
  if (l === "ko") { const krw = vnd / BUDGET.krw_vnd / 1e8; return (krw >= 10 ? krw.toFixed(1) : krw.toFixed(2)) + "억" + (short ? "" : " 원"); }
  if (l === "vi") { const t = vnd / 1e9; return t.toLocaleString("vi-VN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (short ? " tỷ" : " tỷ đồng"); }
  const u = vnd / BUDGET.usd_vnd / 1000; return "USD " + Math.round(u).toLocaleString("en-US") + "K";
}
function moneyAll(vnd) {
  return "VND " + (vnd / 1e9).toFixed(2) + "B · USD " + Math.round(vnd / BUDGET.usd_vnd / 1000) + "K · ₩" + (vnd / BUDGET.krw_vnd / 1e8).toFixed(2) + "억";
}
function renderBudget() {
  if (!BUDGET) return;
  const t = T[lang], tot = BUDGET.total;
  if (!(typeof budgetCounting !== "undefined" && budgetCounting)) document.getElementById("bud-big").textContent = money(tot, lang);
  document.getElementById("bud-sub").textContent = lang === "ko" ? "VND " + (tot / 1e9).toFixed(2) + "B · USD " + Math.round(tot / BUDGET.usd_vnd / 1000) + "K"
    : lang === "vi" ? "≈ USD " + Math.round(tot / BUDGET.usd_vnd / 1000) + "K" : "VND " + (tot / 1e9).toFixed(2) + " bn · KRW " + (tot / BUDGET.krw_vnd / 1e9).toFixed(2) + " bn";
  const cats = [["c1", t.bud_c1, BUDGET.exterior], ["c2", t.bud_c2, BUDGET.interior], ["c3", t.bud_c3, BUDGET.shared]];
  const raw = cats.map(c => c[2] / tot * 100), pct = raw.map(Math.floor);
  raw.map((r, i) => [r - pct[i], i]).sort((a, b) => b[0] - a[0]).slice(0, 100 - pct.reduce((a, b) => a + b, 0)).forEach(([, i]) => pct[i]++);
  const bar = document.getElementById("bud-bar"); bar.innerHTML = "";
  bar.setAttribute("aria-label", cats.map(c => c[1] + " " + money(c[2], lang)).join(", "));
  cats.forEach(c => {
    const sp = el("span", c[0]); sp.style.flex = String(c[2]); sp.style.setProperty("--i", cats.indexOf(c));
    sp.dataset.tip = "<b>" + c[1] + "</b><br>" + moneyAll(c[2]) + "<br>" + pct[cats.indexOf(c)] + "%";
    bar.appendChild(sp);
  });
  document.getElementById("bud-legend").innerHTML = cats.map(c => '<li><i class="' + c[0] + '"></i><span>' + c[1] + '</span><b>' + money(c[2], lang, true) + '</b><em>' + pct[cats.indexOf(c)] + '%</em></li>').join("");
  const max = Math.max(...BUDGET.floors.map(f => f[1]));
  document.getElementById("bud-floors").innerHTML = BUDGET.floors.map((f, fi) => {
    const row = FLOORS[lang].find(r => r[0] === f[0]);
    return '<li data-tip="<b>' + f[0] + ' · ' + row[1] + '</b><br>' + moneyAll(f[1]) + '"><span class="fl">' + f[0] + '</span><span class="trk"><span class="fill" style="--i:' + fi + ';width:' + (f[1] / max * 100).toFixed(1) + '%"><span class="nm">' + row[1] + '</span></span></span><span class="amt">' + money(f[1], lang, true) + '</span></li>';
  }).join("");
}
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");

});
function setLang(l) {

  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = T[l][e.dataset.i18n] || ""; });

// hero fins: strips that rotate open in a wave, like the facade
const fins = document.getElementById("fins");

fins.style.setProperty("--n", n);

// ---------- motion layer (R09) ----------
// Everything is complete at rest; these only add movement on top.
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// program ticker (filled per language from FLOORS)
const tickerEl = document.getElementById("ticker");
function fillTicker() {
  const set = FLOORS[lang].map(r => "<span><b>" + r[0] + "</b>" + r[1] + "</span>").join("");
  const half = set + set;
  tickerEl.innerHTML = half + half;
}

// count-up for figures written in the page (the final value is what sits in the HTML)
function countUp(node) {
  const final = node.dataset.final || node.textContent; node.dataset.final = final;
  if (RM || !/\d/.test(final)) return;
  const t0 = performance.now(), D = 1200;
  (function step(now) {
    const k = clamp((now - t0) / D, 0, 1), e = ease(k);
    node.textContent = final.replace(/\d+(?:[.,]\d+)?/g, m => {
      const dec = (m.split(/[.,]/)[1] || "").length, v = parseFloat(m.replace(",", "."));
      const cur = (v * e).toFixed(dec);
      return m.indexOf(",") > -1 ? cur.replace(".", ",") : cur;

    if (k < 1) requestAnimationFrame(step); else node.textContent = final;
  })(t0);
}
document.querySelectorAll(".facts b, .specs b").forEach(b => { b.dataset.count = "1"; });
let budgetCounting = false;
function countBudget() {
  if (RM || !BUDGET) return;
  const big = document.getElementById("bud-big"), t0 = performance.now(), D = 1400;
  budgetCounting = true;
  (function step(now) {
    const k = clamp((now - t0) / D, 0, 1);
    big.textContent = money(BUDGET.total * ease(k), lang);
    if (k < 1) requestAnimationFrame(step); else { budgetCounting = false; big.textContent = money(BUDGET.total, lang); }
  })(t0);
}

// reveal: elements below the fold replay a short entrance when they come into view
const RV = [
  [".how-head > *", "rv"], [".steps li", "rv"], [".device", "rv"], [".dev-copy > *", "rv"],
  [".floors-head > *", "rv"], [".lv-head > *", "rv"], [".lv-pair figure", "wipe"],
  [".goods .split > *", "rv"], [".building .wrap > .eyebrow, .building .wrap > .h2, .building .wrap > p", "rv"],
  [".building-grid > *", "rv"], [".finstudy", "rv"], [".specs > div", "rv"],
  [".budget-head > *", "rv"], [".b-top", "rv"], [".b-floors", "rv"], [".visit-grid > *", "rv"]

function play(el) {
  const i = Number(el.style.getPropertyValue("--i")) || 0;
  el.classList.add("play");
  (el.matches("[data-count]") ? [el] : el.querySelectorAll("[data-count]")).forEach(countUp);
  if (el.classList.contains("b-top")) countBudget();

  setTimeout(() => el.classList.remove("play"), 2800 + i * 140);
}
if (!RM && "IntersectionObserver" in window) {
  const rio = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { rio.unobserve(e.target); play(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 });
  const vh = window.innerHeight;
  RV.forEach(([sel, cls]) => document.querySelectorAll(sel).forEach(el => {
    el.classList.add(cls);
    el.style.setProperty("--i", Math.min(5, Array.prototype.indexOf.call(el.parentNode.children, el)));
    if (el.getBoundingClientRect().top < vh * 0.92) return;   // already on screen at load: leave it as it is
    rio.observe(el);
  }));
}

// nav: underline the section in view
const navLinks = [...document.querySelectorAll(".nav nav a")];
if ("IntersectionObserver" in window) {
  const nio = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); });
  }, { rootMargin: "-45% 0px -50% 0px" });
  navLinks.forEach(a => { const s = document.querySelector(a.getAttribute("href")); if (s) nio.observe(s); });
}

// scroll engine: progress line, hero parallax, steps line, gentle parallax on floor numbers and isometrics
const progress = document.getElementById("progress"), heroImg = document.querySelector(".hero-img");
const stepsEl = document.querySelector(".steps"), stepLis = [...stepsEl.children];
const PAR = [];
document.querySelectorAll(".level").forEach(lv => {
  PAR.push([lv.querySelector(".lv-num"), lv, -0.07, 46]);
  PAR.push([lv.querySelector(".lv-iso img"), lv.querySelector(".lv-iso .pic"), 0.035, 16]);
});
if (!RM) stepsEl.classList.add("live");
let ticking = false;
function frame() {
  ticking = false;
  const vh = window.innerHeight, max = document.documentElement.scrollHeight - vh;
  progress.style.setProperty("--p", max > 0 ? (window.scrollY / max).toFixed(4) : "0");
  if (RM) return;
  const hr = heroImg.getBoundingClientRect();
  if (hr.bottom > -50) heroImg.style.setProperty("--hp", clamp(-hr.top / hr.height, 0, 1).toFixed(4));
  const sr = stepsEl.getBoundingClientRect(), sp = clamp((vh * 0.9 - sr.top) / (vh * 0.55), 0, 1);
  stepsEl.style.setProperty("--sp", sp.toFixed(3));
  stepLis.forEach((li, i) => li.classList.toggle("lit", sp * stepLis.length > i + 0.15));
  PAR.forEach(([el, ref, k, lim]) => {
    if (!el || !ref) return;
    const r = ref.getBoundingClientRect();
    if (r.bottom < -100 || r.top > vh + 100) return;
    el.style.transform = "translate3d(0," + clamp((r.top + r.height / 2 - vh / 2) * k, -lim, lim).toFixed(1) + "px,0)";
  });
}
function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", () => { onScroll(); placePill(); finSize(); }, { passive: true });
frame();

// hero fins: after they open, they keep breathing and part around the pointer
const heroEl = document.querySelector(".hero-img"), finEls = [...fins.children];
let finsLive = false, heroVisible = true, px = -1, pxs = 0.5, pxw = 0;
finEls.forEach(f => { f.dataset.base = f.style.getPropertyValue("--open"); });
if (!RM && finEls.length) {
  let opened = 0;
  finEls.forEach(f => f.addEventListener("animationend", () => {
    if (++opened < finEls.length) return;
    finEls.forEach(g => { g.style.animation = "none"; });
    finsLive = true; requestAnimationFrame(finLoop);
  }, { once: true }));
  heroEl.addEventListener("pointermove", e => { const r = heroEl.getBoundingClientRect(); px = (e.clientX - r.left) / r.width; });
  heroEl.addEventListener("pointerleave", () => { px = -1; });
  if ("IntersectionObserver" in window) new IntersectionObserver(es => { heroVisible = es[0].isIntersecting; if (heroVisible && finsLive) requestAnimationFrame(finLoop); }).observe(heroEl);
}
function finLoop(t) {
  if (!heroVisible) return;
  const n = finEls.length;
  pxw += ((px < 0 ? 0 : 1) - pxw) * 0.06;
  if (px >= 0) pxs += (px - pxs) * 0.12;
  finEls.forEach((f, i) => {
    const c = (i + 0.5) / n, base = parseFloat(f.dataset.base) || 0.045;
    const wave = 0.016 * Math.sin(t / 1000 * 0.8 + i * 0.45);
    const near = pxw * 0.32 * Math.exp(-Math.pow(c - pxs, 2) / 0.0035);
    f.style.setProperty("--open", Math.max(0.01, base + wave + near).toFixed(4));
  });
  requestAnimationFrame(finLoop);
}

// device: parts light up in turn; hovering a part or its badge holds it
const partLis = [...document.querySelectorAll(".parts li")], badges = [...document.querySelectorAll(".dv-badge")];
let partOn = 0, holdUntil = 0, podsVisible = false;
function setPart(k) {
  partOn = k;
  partLis.forEach((li, i) => li.classList.toggle("on", i === k - 1));
  badges.forEach(b => b.classList.toggle("on", Number(b.dataset.part) === k));
}
partLis.forEach((li, i) => li.addEventListener("pointerenter", () => { holdUntil = Date.now() + 8000; setPart(i + 1); }));
badges.forEach(b => {
  const go = () => { holdUntil = Date.now() + 8000; setPart(Number(b.dataset.part)); };
  b.addEventListener("pointerenter", go); b.addEventListener("click", go);
});
if (!RM && "IntersectionObserver" in window) {
  new IntersectionObserver(es => { podsVisible = es[0].isIntersecting; }, { threshold: 0.3 }).observe(document.getElementById("pods"));
  setInterval(() => { if (podsVisible && Date.now() > holdUntil) setPart(partOn % 5 + 1); }, 2200);
}

// floor rail: one pill slides to the active floor
const pill = el("li", "rail-pill"); pill.setAttribute("aria-hidden", "true"); rail.appendChild(pill);
function placePill() {
  const a = rail.querySelector('a[aria-current="true"]'); if (!a) return;
  const ra = rail.getBoundingClientRect(), aa = a.getBoundingClientRect();
  pill.style.width = aa.width + "px"; pill.style.height = aa.height + "px";
  pill.style.transform = "translate(" + (aa.left - ra.left) + "px," + (aa.top - ra.top) + "px)";
  rail.classList.add("has-pill");
}
const _setActive = setActive;
setActive = function (f) { _setActive(f); requestAnimationFrame(placePill); };

// day / dusk comparison
const cmp = document.getElementById("compare"), cmpRange = document.getElementById("cmp-range");
let cmpTouched = false;
function setCmp(v) { cmp.style.setProperty("--x", v + "%"); }
cmpRange.addEventListener("input", () => { cmpTouched = true; setCmp(cmpRange.value); });
function sweepCompare() {
  if (RM || cmpTouched) return;
  const keys = [[0, 50], [0.35, 22], [0.75, 78], [1, 50]], t0 = performance.now(), D = 2600;
  (function step(now) {
    if (cmpTouched) return;
    const k = clamp((now - t0) / D, 0, 1);
    let j = 0; while (j < keys.length - 2 && k > keys[j + 1][0]) j++;
    const a = keys[j], b = keys[j + 1], u = (k - a[0]) / (b[0] - a[0]);
    const v = a[1] + (b[1] - a[1]) * (0.5 - Math.cos(Math.PI * clamp(u, 0, 1)) / 2);
    setCmp(v.toFixed(2)); cmpRange.value = v;
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

// fin study: plan of every fin, at the angle fixed in the 3D model; only the LED tips are animated
const FIN = { L: 18.946, pitch: 0.25, n: 76, amp: 40, wl: 7.5, lag: 0.85, rows: ["R", "6F", "5F", "4F", "3F", "2F"] };
const fcv = document.getElementById("fincv"), fctx = fcv.getContext("2d"), fread = document.getElementById("finread");
let finHover = null, finT0 = null, finVisible = false, finLayout = null;
const glow = document.createElement("canvas"); glow.width = glow.height = 32;
(function () { const g = glow.getContext("2d"), r = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  r.addColorStop(0, "rgba(255,236,205,1)"); r.addColorStop(0.25, "rgba(255,205,150,0.85)"); r.addColorStop(1, "rgba(255,180,110,0)");
  g.fillStyle = r; g.fillRect(0, 0, 32, 32); })();
function finAngle(i, li) { const s = Math.min(FIN.L, i * FIN.pitch + 0.05); return FIN.amp * Math.sin(2 * Math.PI * (s / FIN.wl) - li * FIN.lag); }
function finSize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = fcv.clientWidth, h = fcv.clientHeight;
  if (!w || !h) return;
  fcv.width = Math.round(w * dpr); fcv.height = Math.round(h * dpr);
  const padL = 30, padR = 10, top = 34, bot = 6, W = w - padL - padR;
  // keep each fin at least ~45 px per metre: on a phone this shows the first few metres of the facade
  const span = Math.min(FIN.L, Math.max(4.5, Math.floor(W / 45 / FIN.pitch) * FIN.pitch));
  finLayout = { dpr, w, h, span, padL, top, rowH: (h - top - bot) / 6, k: W / span, count: FIN.n };
  drawFins(performance.now());
}
function fmtM(v) { const s = v.toFixed(2); return lang === "vi" ? s.replace(".", ",") : s; }
function drawFins(now) {
  const Lo = finLayout; if (!Lo) return;
  const c = fctx; c.setTransform(Lo.dpr, 0, 0, Lo.dpr, 0, 0); c.clearRect(0, 0, Lo.w, Lo.h);
  const x0 = Lo.padL, x1 = Lo.padL + Lo.span * Lo.k, y = 13;
  c.strokeStyle = "#5d5752"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.moveTo(x0, y - 5); c.lineTo(x0, y + 5); c.moveTo(x1, y - 5); c.lineTo(x1, y + 5); c.stroke();
  const dim = Lo.span < FIN.L ? fmtM(Lo.span) + " / " + fmtM(FIN.L) + " m" : fmtM(FIN.L) + " m";
  c.font = "600 11px 'Space Grotesk', sans-serif"; const tw = c.measureText(dim).width;
  c.fillStyle = "#161417"; c.fillRect((x0 + x1) / 2 - tw / 2 - 8, y - 8, tw + 16, 16);
  c.fillStyle = "#a59e96"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(dim, (x0 + x1) / 2, y + 0.5);
  const settle = (RM || finT0 === null) ? 1 : clamp((now - finT0) / 1800, 0, 1);   // at rest: the real angles
  const Lp = Math.max(5, 0.24 * Lo.k), th = Math.max(1.4, 0.045 * Lo.k), g = Math.max(7, th * 4.2);
  const tt = now / 1000;
  for (let r = 0; r < 6; r++) {
    const li = 5 - r, cy = Lo.top + Lo.rowH * (r + 0.5);
    c.fillStyle = "#8f877e"; c.textAlign = "left"; c.font = "600 10px 'Space Grotesk', sans-serif"; c.fillText(FIN.rows[r], 0, cy);
    c.strokeStyle = "rgba(255,255,255,0.06)"; c.beginPath(); c.moveTo(x0, cy); c.lineTo(x1, cy); c.stroke();
    for (let i = 0; i < Lo.count; i++) {
      const s = i * FIN.pitch + 0.05; if (s > Lo.span) break;
      const x = x0 + s * Lo.k, e = ease(clamp(settle * 1.7 - (s / Lo.span) * 0.7, 0, 1));
      const a = finAngle(i, li) * e * Math.PI / 180;
      const hot = finHover && finHover.r === r && finHover.i === i;
      c.save(); c.translate(x, cy); c.rotate(a);
      c.fillStyle = hot ? "#e8c5bf" : "rgba(236,230,221,0.92)";
      c.fillRect(-th / 2, -Lp / 2, th, Lp);
      const b = RM ? 0.75 : 0.18 + 0.82 * Math.pow(0.5 + 0.5 * Math.sin(2 * Math.PI * s / 6 - tt * 1.5 - li * 0.55), 4);
      c.globalAlpha = hot ? 1 : b; c.drawImage(glow, -g / 2, Lp / 2 - g / 2, g, g); c.globalAlpha = 1;
      c.restore();
    }
  }
}
function finLoopDraw(now) { if (!finVisible) return; drawFins(now); if (!RM) requestAnimationFrame(finLoopDraw); }
function finReadDefault() { fread.textContent = T[lang].fin_default; }
fcv.addEventListener("pointermove", e => {
  const Lo = finLayout; if (!Lo) return;
  const rc = fcv.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top;
  const r = Math.floor((y - Lo.top) / Lo.rowH), i = Math.round(((x - Lo.padL) / Lo.k - 0.05) / FIN.pitch);
  if (r < 0 || r > 5 || i < 0 || i >= Lo.count || (i * FIN.pitch + 0.05) > Lo.span) { finHover = null; finReadDefault(); }
  else {
    finHover = { r, i };
    const a = finAngle(i, 5 - r);
    fread.textContent = FIN.rows[r] + " · " + T[lang].fin_word + " " + (i + 1) + "/" + FIN.n + " · " + (a >= 0 ? "+" : "−") + Math.abs(a).toFixed(0) + "°";
  }
  if (RM) drawFins(performance.now());
});
fcv.addEventListener("pointerleave", () => { finHover = null; finReadDefault(); if (RM) drawFins(performance.now()); });
if ("IntersectionObserver" in window) {
  new IntersectionObserver(es => {
    finVisible = es[0].isIntersecting;
    if (finVisible && finT0 === null) finT0 = performance.now();
    if (finVisible) requestAnimationFrame(finLoopDraw);
  }, { threshold: 0.15 }).observe(fcv);
} else { finT0 = 0; }
finSize();

// Saigon local time (UTC+7)
const sgt = document.getElementById("sgt");
function tickClock() {
  const d = new Date(Date.now() + 7 * 3600e3), hh = String(d.getUTCHours()).padStart(2, "0"), mm = String(d.getUTCMinutes()).padStart(2, "0");
  sgt.innerHTML = hh + '<span class="colon">:</span>' + mm;
}
tickClock(); setInterval(tickClock, 15000);

function motionLang() {

  fcv.setAttribute("aria-label", T[lang].fin_cap);
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", T[lang][e.dataset.i18nAria] || ""));
  drawFins(performance.now());
  requestAnimationFrame(placePill);
}
